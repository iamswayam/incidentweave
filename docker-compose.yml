services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: incidentweave
      POSTGRES_USER: incidentweave
      POSTGRES_PASSWORD: incidentweave
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentweave -d incidentweave"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://incidentweave:incidentweave@db:5432/incidentweave
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
