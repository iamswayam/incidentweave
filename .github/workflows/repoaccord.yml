name: RepoAccord
on:
  push:
    branches:
      - "bot/**"
permissions:
  contents: read
concurrency:
  group: repoaccord-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repoaccord:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.REPOACCORD_CLIENT_ID }}
          private-key: ${{ secrets.REPOACCORD_APP_PRIVATE_KEY }}
      - uses: sensiwolf/repoaccord@cbc889849b352f55e774bd29d22c33f84aa4f54d # v0.2.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          dry-run: ${{ vars.REPOACCORD_DRY_RUN || 'true' }}
