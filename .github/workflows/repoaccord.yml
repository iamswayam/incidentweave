name: RepoAccord
on:
  push:
    branches:
      - "bot/**"
permissions:
  contents: read
concurrency:
  group: repoaccord-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repoaccord:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.REPOACCORD_CLIENT_ID }}
          private-key: ${{ secrets.REPOACCORD_APP_PRIVATE_KEY }}
      - uses: sensiwolf/repoaccord@cbc889849b352f55e774bd29d22c33f84aa4f54d # v0.2.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          dry-run: ${{ vars.REPOACCORD_DRY_RUN || 'true' }}
