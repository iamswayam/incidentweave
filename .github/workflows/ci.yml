name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.11"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Build Docker image
        run: docker build -f docker/Dockerfile .

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.11"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Run unit tests
        run: uv run --no-sync python -m pytest tests/unit -q --durations=15

  unit-python-313:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.11"
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Run unit tests
        run: uv run --no-sync python -m pytest tests/unit -q --durations=15

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: incidentweave
          POSTGRES_PASSWORD: incidentweave
          POSTGRES_DB: incidentweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentweave -d incidentweave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.11"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: incidentweave
        run: |
          pg_isready -h localhost -p 5432 -U incidentweave -d incidentweave
          uv run --no-sync python -c "import socket; s=socket.create_connection(('localhost', 5432), 5); print('PostgreSQL TCP connection OK'); s.close()"

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://incidentweave:incidentweave@localhost:5432/incidentweave
        run: uv run --no-sync alembic upgrade head

      - name: Integration tests
        env:
          DATABASE_URL: postgresql+psycopg://incidentweave:incidentweave@localhost:5432/incidentweave
        run: uv run --no-sync python -m pytest tests/integration -q

  evaluation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: incidentweave
          POSTGRES_PASSWORD: incidentweave
          POSTGRES_DB: incidentweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentweave -d incidentweave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.11"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: incidentweave
        run: |
          pg_isready -h localhost -p 5432 -U incidentweave -d incidentweave
          uv run --no-sync python -c "import socket; s=socket.create_connection(('localhost', 5432), 5); print('PostgreSQL TCP connection OK'); s.close()"

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://incidentweave:incidentweave@localhost:5432/incidentweave
        run: uv run --no-sync alembic upgrade head

      - name: Evaluation harness tests
        run: uv run --no-sync python -m pytest tests/evaluation -q

      - name: Offline retrieval gate
        env:
          DATABASE_URL: postgresql+psycopg://incidentweave:incidentweave@localhost:5432/incidentweave
        run: uv run --no-sync python -m scripts.check_retrieval_gate --split smoke
