name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Build Docker image
        run: docker build -f docker/Dockerfile .

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/unit -q --durations=15

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: incidentweave
          POSTGRES_PASSWORD: incidentweave
          POSTGRES_DB: incidentweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentweave -d incidentweave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: incidentweave
        run: |
          pg_isready -h localhost -p 5432 -U incidentweave -d incidentweave
          python -c "import socket; s=socket.create_connection(('localhost', 5432), 5); print('PostgreSQL TCP connection OK'); s.close()"

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://incidentweave:incidentweave@localhost:5432/incidentweave
        run: alembic upgrade head

      - name: Integration tests
        env:
          DATABASE_URL: postgresql+psycopg://incidentweave:incidentweave@localhost:5432/incidentweave
        run: python -m pytest tests/integration -q

  evaluation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: incidentweave
          POSTGRES_PASSWORD: incidentweave
          POSTGRES_DB: incidentweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentweave -d incidentweave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: incidentweave
        run: |
          pg_isready -h localhost -p 5432 -U incidentweave -d incidentweave
          python -c "import socket; s=socket.create_connection(('localhost', 5432), 5); print('PostgreSQL TCP connection OK'); s.close()"

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://incidentweave:incidentweave@localhost:5432/incidentweave
        run: alembic upgrade head

      - name: Evaluation harness tests
        run: python -m pytest tests/evaluation -q

      - name: Offline retrieval gate
        env:
          DATABASE_URL: postgresql+psycopg://incidentweave:incidentweave@localhost:5432/incidentweave
        run: python -m scripts.check_retrieval_gate --split smoke
