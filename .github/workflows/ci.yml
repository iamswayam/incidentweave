name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download and verify Gitleaks
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" \
            --output checksums.txt
          grep -F "${checksum}  ${archive}" checksums.txt
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" \
            --output "${archive}"
          printf '%s  %s\n' "${checksum}" "${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks

      - name: Scan full Git history
        run: ./gitleaks git --log-opts="--all" --redact --exit-code 1

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.11"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Export locked requirements
        run: uv export --locked --no-hashes --no-emit-project --all-groups --format requirements-txt --output-file /tmp/requirements.txt

      - name: Audit locked dependencies
        run: uv run --no-sync pip-audit --requirement /tmp/requirements.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.11"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Pre-commit
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

      - name: Build Docker image
        run: docker build -f docker/Dockerfile .

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.11"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Run unit tests
        run: uv run --no-sync python -m pytest tests/unit -q --durations=15

  unit-python-313:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.11"
          python-version: "3.13"
          enable-cache: true

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Run unit tests
        run: uv run --no-sync python -m pytest tests/unit -q --durations=15

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: incidentweave
          POSTGRES_PASSWORD: incidentweave
          POSTGRES_DB: incidentweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentweave -d incidentweave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.11"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: incidentweave
        run: |
          pg_isready -h localhost -p 5432 -U incidentweave -d incidentweave
          uv run --no-sync python -c "import socket; s=socket.create_connection(('localhost', 5432), 5); print('PostgreSQL TCP connection OK'); s.close()"

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://incidentweave:incidentweave@localhost:5432/incidentweave
        run: uv run --no-sync alembic upgrade head

      - name: Integration tests
        env:
          DATABASE_URL: postgresql+psycopg://incidentweave:incidentweave@localhost:5432/incidentweave
        run: uv run --no-sync python -m pytest tests/integration -q

  evaluation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: incidentweave
          POSTGRES_PASSWORD: incidentweave
          POSTGRES_DB: incidentweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentweave -d incidentweave"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.11"
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies from uv.lock
        run: uv sync --locked

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: incidentweave
        run: |
          pg_isready -h localhost -p 5432 -U incidentweave -d incidentweave
          uv run --no-sync python -c "import socket; s=socket.create_connection(('localhost', 5432), 5); print('PostgreSQL TCP connection OK'); s.close()"

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://incidentweave:incidentweave@localhost:5432/incidentweave
        run: uv run --no-sync alembic upgrade head

      - name: Evaluation harness tests
        run: uv run --no-sync python -m pytest tests/evaluation -q

      - name: Offline retrieval gate
        env:
          DATABASE_URL: postgresql+psycopg://incidentweave:incidentweave@localhost:5432/incidentweave
        run: uv run --no-sync python -m scripts.check_retrieval_gate --split smoke
